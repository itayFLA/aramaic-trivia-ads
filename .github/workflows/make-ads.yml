name: make-ads

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many ads to build"
        default: "1"
      voice:
        description: "auto / gemini / edge / mock"
        default: "auto"
      bank:
        description: "Question bank file"
        default: "bank.txt"
      out:
        description: "Output folder"
        default: "videos"
      use_state:
        description: "true = continue from state.json and update it"
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q pillow numpy python-bidi edge-tts

      - name: Arrange assets
        run: |
          mkdir -p assets/fonts
          for f in background.png logo.png sound.m4a tick.wav end_sound.wav; do [ -f "$f" ] && mv -n "$f" assets/ || true; done
          for f in Heebo-800.ttf Heebo-900.ttf Heebo-LICENSE.txt; do [ -f "$f" ] && mv -n "$f" assets/fonts/ || true; done
          ls -R assets

      - name: Prepare bank (random answer order, drop incomplete ad)
        run: |
          python3 - "${{ github.event.inputs.bank }}" prepared_bank.txt <<'PY'
          import sys, random, hashlib, itertools
          src, dst = sys.argv[1], sys.argv[2]
          lines = open(src, encoding='utf-8-sig').read().split('\n')
          def special(s):
              s = s.strip()
              return s == '' or s == '---' or s.startswith('//') or s.startswith('#')
          blocks, i = [], 0
          while i < len(lines):
              if special(lines[i]):
                  i += 1
                  continue
              j = i
              while j < len(lines) and not special(lines[j]):
                  j += 1
              blocks.append((i, j))
              i = j
          allowed = [s for s in itertools.product(range(3), repeat=3) if len(set(s)) > 1 and s not in ((0, 1, 2), (2, 1, 0))]
          def md5i(t):
              return int(hashlib.md5(t.strip().encode('utf-8')).hexdigest(), 16)
          for k, (a, b) in enumerate(blocks):
              blk = lines[a:b]
              if len(blk) != 4:
                  continue
              ad_first = lines[blocks[(k // 3) * 3][0]]
              seq = allowed[md5i(ad_first) % len(allowed)]
              target = seq[k % 3]
              ans = blk[1:]
              marked = [x for x in ans if x.strip().startswith('*')]
              if len(marked) != 1:
                  continue
              others = [x for x in ans if x is not marked[0]]
              random.Random(md5i(blk[0])).shuffle(others)
              others.insert(target, marked[0])
              lines[a:b] = [blk[0]] + others
          extra = len(blocks) % 3
          if extra:
              print(f'ignoring {extra} leftover question(s) at the end')
              lines = lines[:blocks[-extra][0]]
          open(dst, 'w', encoding='utf-8').write('\n'.join(lines))
          print(f'{len(blocks)} questions, answers shuffled')
          PY

      - name: Build ads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BANK="prepared_bank.txt"
          OUT="${{ github.event.inputs.out }}"
          USE_STATE="${{ github.event.inputs.use_state }}"
          mkdir -p "$OUT"
          DONE=0
          if [ "$USE_STATE" = "true" ] && [ -f state.json ]; then DONE=$(python3 -c "import json;print(json.load(open('state.json'))['done'])"); fi
          echo "already done: $DONE"
          python3 make_ads.py "$BANK" --voice "${{ github.event.inputs.voice }}" --skip "$DONE" --count "${{ github.event.inputs.count }}" --out "$OUT"
          if [ "$USE_STATE" = "true" ]; then
            LAST=$(ls "$OUT" | sed -n 's/^ad_0*\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
            echo "{\"done\": ${LAST:-0}}" > state.json
            cat state.json
          fi

      - name: Commit videos
        run: |
          git config user.name "ads-bot"
          git config user.email "ads-bot@users.noreply.github.com"
          git add videos* state.json 2>/dev/null || true
          git commit -m "Add generated ads" || echo "nothing to commit"
          git push
